
name: Create Neuro Trigger and Command

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-folders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p src/main/java/ru/zov/implement/features/modules/combat/killaura/neuro
          mkdir -p src/main/java/ru/zov/implement/features/modules/render/betterrain
          mkdir -p src/main/java/ru/zov/implement/features/modules/combat/command

          touch src/main/java/ru/zov/implement/features/modules/combat/killaura/neuro/.gitkeep
          touch src/main/java/ru/zov/implement/features/modules/render/betterrain/.gitkeep
          touch src/main/java/ru/zov/implement/features/modules/combat/command/.gitkeep

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/java/ru/zov/implement/features/modules/combat/

          git commit -m "Create neuro trigger and command folders" || exit 0
          git push
          
