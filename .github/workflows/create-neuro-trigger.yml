
name: Create Neuro Trigger and Command

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  create-folders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p src/main/java/ru/zov/implement/features/modules/combat/killaura/trigger
          mkdir -p src/main/java/ru/zov/implement/features/modules/combat/command

          touch "src/main/java/ru/zov/implement/features/modules/combat/killaura/trigger/.gitkeep"
          touch src/main/java/ru/zov/implement/features/modules/combat/command/.gitkeep

      - name: Commit folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/java/ru/zov/implement/features/modules/combat/

          git commit -m "Create neuro trigger and command folders" || exit 0
          git push
          
