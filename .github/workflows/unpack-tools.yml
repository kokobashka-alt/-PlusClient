
name: Unpack Gradle and IDEA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP files
        run: |
          mkdir -p extracted

          unzip -o gradle.zip -d extracted
          unzip -o .idea.zip -d extracted

          cp -r extracted/. .
          rm -rf extracted gradle.zip .idea.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Gradle and IDEA" || echo "Nothing to commit"
          git push
          
