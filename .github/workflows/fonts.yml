
name: Create Fonts Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create fonts
        run: |
          mkdir -p fonts
          cp custom-icons.png fonts/
          cp custom-icons.json fonts/
          cp energy.png fonts/
          cp energy.json fonts/
          cp glyphter.png fonts/
          cp glyphter.json fonts/
          cp mediumsui.png fonts/
          cp mediumsui.json fonts/
          cp icons3.png fonts/
          cp icons3.json fonts/

      - name: Commit fonts folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/
          git commit -m "Add fonts folder" || exit 0
          git push
          
